[package]
name = "datavisual-frontend"
version = "0.1.0"
edition = "2024"
description = "DataVisualServer 原生 Windows 前端"
authors = ["DataVisual"]

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Storage_Pickers",
    "System",
    "ApplicationModel",
    "UI",
    "UI_Core",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Data_Xml_Dom",
] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
anyhow = "1.0"
thiserror = "2.0"
url = "2.5"
tungstenite = { version = "0.24", features = ["native-tls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
