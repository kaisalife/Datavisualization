[package]
name = "datavisual-winui"
version = "0.1.0"
edition = "2024"
description = "DataVisualServer WinUI3 前端"
authors = ["DataVisual"]

[lib]
name = "main"

[dependencies]
winio = { version = "0.11", default-features = false, features = ["winui"] }
compio = "0.18"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
anyhow = "1.0"
thiserror = "2.0"
url = "2.5"
tungstenite = { version = "0.24", features = ["native-tls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
