[pytest]
# 测试根目录
testpaths = tests

# 测试文件匹配
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试标记
markers =
    whitebox: 白盒单元测试（内部逻辑）
    blackbox: 黑盒测试（API 接口 / E2E）
    integration: 集成测试（多模块协作）
    slow: 耗时超过 10 秒的测试
    needs_llm: 需要真实 LLM 服务（默认在 CI 中 skip）
    needs_network: 需要网络访问（默认在 CI 中 skip）

# 默认跳过需要真实 LLM / 网络的测试
addopts = -v --tb=short -m "not needs_llm and not needs_network"

# 异步测试支持
asyncio_mode = auto

# 日志输出
log_cli = false
log_cli_level = WARNING
