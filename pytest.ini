[pytest]
# 测试根目录
testpaths = tests

# 测试文件匹配
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试标记
markers =
    whitebox: 白盒单元测试（内部逻辑）
    blackbox: 黑盒测试（API 接口 / E2E）
    integration: 集成测试（多模块协作）
    slow: 耗时超过 10 秒的测试
    extended: 扩展回归（数据接入/RAG/真实文件等，默认不跑；完整回归时显式运行）
    needs_llm: 需要真实 LLM 服务（默认在 CI 中 skip）
    needs_network: 需要网络访问（默认在 CI 中 skip）

# 默认只跑核心链路（数据 → series → plan → 生成校验），减少日常反馈噪音。
# 完整回归：pytest -o addopts="" -m "not needs_llm and not needs_network"
addopts = -q --tb=short -m "not needs_llm and not needs_network and not extended"

# 异步测试支持
asyncio_mode = auto

# 日志输出
log_cli = false
log_cli_level = WARNING
